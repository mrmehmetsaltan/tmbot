name: Togg cam tavan kontrolü

on:
  schedule:
    - cron: "*/5 * * * *"      # her 5 dakikada bir (GitHub bazen birkaç dk geciktirir)
  workflow_dispatch:           # Actions sekmesinden "Run workflow" ile elle çalıştırma

permissions:
  contents: write              # data/state.json'u repo'ya geri yazabilmek için

concurrency:
  group: togg-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests

      - name: Kontrol et
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'scheduled' }}
          # İsterseniz hedef konfigürasyonu burada değiştirin:
          # TARGET_RENK: mardin
          # TARGET_KOLTUK: seats-faux-leather-black
        run: python check_once.py

      - name: Durumu kaydet
        run: |
          git config user.name "togg-bot"
          git config user.email "togg-bot@users.noreply.github.com"
          git add data/state.json
          if git diff --cached --quiet; then
            echo "Durum değişmedi, commit yok."
          else
            git commit -m "state: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
